[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team_control"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "protobuf",
    "PyYAML",
    "shapely",  # obstacle avoidance (motion/obstacles) needs it on every run
]

dynamic = [
    "version"
]

[tools.setuptools.packages.find]
where = ["src"]

[tools.setuptools.dynamic]
version = {attr = "team_control.__version__"}

[project.optional-dependencies]
pathplanning = [
    "scikit-learn",
    "networkx",
    ]
trajectory = [
    "scikit-learn",
]