[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team_control"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
    "protobuf",
    "shapely",
    "PyYAML",
    "tensordict>=0.11.0",
]

dynamic = [
    "version"
]

[tools.setuptools.packages.find]
where = ["src"]

[tools.setuptools.dynamic]
version = {attr = "BitKickers.__version__"}

[project.optional-dependencies]
pathplanning = [
    "Shapely",
    "scikit-learn",
    "networkx",
]
trajectory = [
    "scikit-learn",
]
