[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team_control"
version = "0.1.0"
description = "BitKickers team control for the RoboCup SSL lab course (Uni Freiburg, WS 25/26)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "protobuf",
    "PyYAML",
    "shapely",  # obstacle avoidance (motion/obstacles) needs it on every run
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Lint + format: `ruff check .` and `ruff format .` (pip install -e .[dev])
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
extend-exclude = ["src/team_control/network/proto2"]  # generated by protoc

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused/undefined names, star imports
    "I",       # import sorting
    "UP",      # pyupgrade (target taken from requires-python)
    "B",       # bugbear: likely bugs
]
ignore = [
    "E501",    # line length: left to the formatter
]
